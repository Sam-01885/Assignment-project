<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - Food Ordering System</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <div class="container">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="logo.jpg" alt="Food Ordering System Logo" class="logo">
        </div>

        <!-- Registration Form -->
        <div class="registration-container">
            <div class="form-wrapper">
                <h1>Create Your Account</h1>
                <p class="subtitle">Join us to start ordering delicious food</p>

                <form id="registrationForm" novalidate>
                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName">Full Name <span class="required">:</span></label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            placeholder="Enter your full name"
                            required
                        >
                        <span class="error-message" id="fullNameError"></span>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email Address <span class="required">:</span></label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email address"
                            required
                        >
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <!-- Phone Number -->
                    <div class="form-group">
                        <label for="phone">Phone Number <span class="required">:</span></label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            placeholder="Enter your phone number"
                            required
                        >
                        <span class="error-message" id="phoneError"></span>
                    </div>

                    <!-- Address -->
                    <div class="form-group">
                        <label for="address">Street Address <span class="required">:</span></label>
                        <input 
                            type="text" 
                            id="address" 
                            name="address" 
                            placeholder="Enter your street address"
                            required
                        >
                        <span class="error-message" id="addressError"></span>
                    </div>

                    <!-- City and Postal Code Row -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City <span class="required">:</span></label>
                            <input 
                                type="text" 
                                id="city" 
                                name="city" 
                                placeholder="Enter your city"
                                required
                            >
                            <span class="error-message" id="cityError"></span>
                        </div>

                        <div class="form-group">
                            <label for="postalCode">Postal Code <span class="required">:</span></label>
                            <input 
                                type="text" 
                                id="postalCode" 
                                name="postalCode" 
                                placeholder="Enter postal code"
                                required
                            >
                            <span class="error-message" id="postalCodeError"></span>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password <span class="required">:</span></label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter a strong password"
                            required
                        >
                        <span class="password-hint">Minimum 8 characters, include uppercase, lowercase, and numbers</span>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span class="required">:</span></label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Re-enter your password"
                            required
                        >
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn">Create Account</button>

                    <!-- Login Link -->
                    <p class="login-link">
                        Already have an account? <a href="#" class="link">Sign In</a>
                    </p>
                </form>

                <!-- Success Message -->
                <div class="success-message" id="successMessage" style="display: none;">
                    <h2>Registration Successful!</h2>
                    <p>Your account has been created successfully. Welcome to our food ordering system!</p>
                    <button type="button" class="submit-btn" id="resetBtn">Register Another Account</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
